[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-neuron-engine"
version = "0.1.0"
description = "Real GPT-2 forward-pass analysis for Project NEURON"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6,<3", "transformers>=4.50,<5", "numpy>=1.24,<3", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
neuron-smoke = "engine.cli:main"
neuron-worker = "engine.protocol:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: requires the real pretrained GPT-2 weights"]
