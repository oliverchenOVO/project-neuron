name: Phase 0 real GPT-2 validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --no-compile -r requirements-cpu.lock
      - run: python -m pip install --no-compile --no-deps -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: resources/models/gpt2
          key: gpt2-607a30d783dfa663caf39e06633721c8d4cfcd7e
      - run: python -m scripts.download_model
      - run: python -m engine.cli --model-dir resources/models/gpt2 --offline
      - run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - run: python -m scripts.validate_phase0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-evidence
          path: artifacts/
